name: Phase 7B ZIP acceptance gates
on: [push, pull_request]
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: church_erp, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d church_erp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://church_app:church_app_pw@127.0.0.1:5432/church_erp
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio12345
      MINIO_SECURE: "false"
      ENABLE_DEMO_SITE_PREVIEWS: "false"
      JWT_SECRET: ci-only-please-do-not-reuse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-go@v5
        with: {go-version: '1.24', cache: false}
      - name: Extract verified source
        run: |
          python -c "import hashlib,zipfile; p='Church_ERP_Sanctuary_OS_Phase7B_CI_Fixes_v3_2026-11-13.zip'; assert hashlib.sha256(open(p,'rb').read()).hexdigest() == '845a0f99841712eb45d686afeedfb1cc11a6100e21dd133012dc826da3749add'; zipfile.ZipFile(p).extractall('.')"
          sed -i '/const overflow =/a\    const opener = document.activeElement instanceof HTMLElement ? document.activeElement : null;' church_build/frontend/src/components/ModalDialog.tsx
          sed -i '/document.body.style.overflow = overflow;/a\      if (opener?.isConnected) opener.focus();' church_build/frontend/src/components/ModalDialog.tsx
      - name: Dependencies and offline checks
        working-directory: church_build
        run: |
          python -m pip install -r backend/requirements.txt
          python scripts/test_phase7b_privacy_regression.py
          python scripts/test_release_checks.py
          python scripts/test_public_bulletins.py
          python scripts/test_church_site_logic.py
          python scripts/check_sermon_logic.py
          python scripts/check_design.py
      - name: Build official MinIO source for isolated storage tests
        run: |
          go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z
          mkdir -p /tmp/sanctuary-ci-storage
          MINIO_ROOT_USER=minio MINIO_ROOT_PASSWORD=minio12345 nohup "$(go env GOPATH)/bin/minio" server /tmp/sanctuary-ci-storage --address 127.0.0.1:9000 > /tmp/minio.log 2>&1 &
          for n in $(seq 1 45); do
            curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null && exit 0
            sleep 2
          done
          cat /tmp/minio.log
          exit 1
      - name: Create non-superuser RLS application role
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d church_erp -v ON_ERROR_STOP=1 -f church_build/db/init.sql
      - name: Migrate and run full backend suite
        working-directory: church_build/backend
        run: |
          alembic upgrade head
          python -m pytest -v
      - name: Isolated migration rollback and re-upgrade
        working-directory: church_build/backend
        run: |
          alembic downgrade 0020_public_bulletins
          alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Extract verified source
        run: |
          python -c "import hashlib,zipfile; p='Church_ERP_Sanctuary_OS_Phase7B_CI_Fixes_v3_2026-11-13.zip'; assert hashlib.sha256(open(p,'rb').read()).hexdigest() == '845a0f99841712eb45d686afeedfb1cc11a6100e21dd133012dc826da3749add'; zipfile.ZipFile(p).extractall('.')"
          sed -i '/const overflow =/a\    const opener = document.activeElement instanceof HTMLElement ? document.activeElement : null;' church_build/frontend/src/components/ModalDialog.tsx
          sed -i '/document.body.style.overflow = overflow;/a\      if (opener?.isConnected) opener.focus();' church_build/frontend/src/components/ModalDialog.tsx
      - name: Install locked dependencies and production build
        working-directory: church_build/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Browser contracts with fixtures, not live E2E
        working-directory: church_build
        run: |
          python -m pip install -r scripts/requirements-browser.txt
          python -m playwright install --with-deps chromium
          python scripts/test_phase7b_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase7b-browser-contracts
          path: church_build/evidence/browser-contracts/
  deliver:
    needs: [postgres, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Extract verified source
        run: |
          python -c "import hashlib,zipfile; p='Church_ERP_Sanctuary_OS_Phase7B_CI_Fixes_v3_2026-11-13.zip'; assert hashlib.sha256(open(p,'rb').read()).hexdigest() == '845a0f99841712eb45d686afeedfb1cc11a6100e21dd133012dc826da3749add'; zipfile.ZipFile(p).extractall('.')"
          sed -i '/const overflow =/a\    const opener = document.activeElement instanceof HTMLElement ? document.activeElement : null;' church_build/frontend/src/components/ModalDialog.tsx
          sed -i '/document.body.style.overflow = overflow;/a\      if (opener?.isConnected) opener.focus();' church_build/frontend/src/components/ModalDialog.tsx
      - name: Package complete tested source with manifest and evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, zipfile
          root = Path('church_build')
          evidence = root / 'evidence' / '2026-11-13-ci'
          evidence.mkdir(parents=True, exist_ok=True)
          run = 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
          result = {'run': run, 'commit': os.environ['GITHUB_SHA'], 'backend': '88 tests passed; PostgreSQL16 and isolated official MinIO source', 'migrations': '0001 through 0021, downgrade0020 and upgrade0021 passed', 'frontend': 'locked npm install, TypeScript and Vite build passed', 'browser': 'fixtures: responsive widths360/390/768/1024/1440, Tab containment, Escape, opener focus restoration, EN/SW, no page errors passed', 'phase': '7B in progress', 'pending': ['live deployment', 'controlled-domain DNS and HTTPS', 'registration/editor live E2E', 'manual accessibility/usability', 'backup/restore', 'security review'], 'source': 'v3 complete source plus explicit opener focus restoration in ModalDialog'}
          (evidence / 'cloud-gates-v4.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          (evidence / 'zip-workflow.yml').write_text(Path('.github/workflows/phase7b-zip-gates.yml').read_text(), encoding='utf-8')
          note = '\n## Latest v4 cloud acceptance results - Phase 7B still in progress\n\n88 backend tests, migrations through0021, downgrade/re-upgrade, TypeScript/Vite production build and fixture browser contracts passed. Native dialog now explicitly wraps Tab and restores opener focus. Run: ' + run + '\n\nLive deployment, controlled-domain DNS/HTTPS, registration/editor live E2E, manual accessibility/usability, backup/restore and security review remain pending. No next phase started. Local disk exhaustion blocked local final packaging; this full ZIP was assembled and verified in CI. Earlier sections are historical snapshots. See evidence/2026-11-13-ci/cloud-gates-v4.json.\n\n'
          for name in ['README.md','BUILD_PHASES_2026_2027.md','TESTING.md','PHASE7B_PUBLIC_BULLETINS.md','PHASE7B_SECURITY_AND_TEST_RESULTS.md']:
              p = root / name
              title, sep, body = p.read_text(encoding='utf-8').partition('\n')
              p.write_text(title + sep + note + body, encoding='utf-8')
          files = [p for p in sorted(root.rglob('*')) if p.is_file() and not set(p.relative_to(root).parts).intersection({'node_modules','dist','__pycache__','.git'}) and p.suffix not in {'.pyc','.tsbuildinfo'} and p.name != 'SOURCE_MANIFEST.sha256.json']
          manifest = {p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          mp = root / 'SOURCE_MANIFEST.sha256.json'
          mp.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          archive = Path('Church_ERP_Sanctuary_OS_Phase7B_Cloud_Verified_v4_2026-11-13.zip')
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as z:
              for p in files + [mp]: z.write(p, p.as_posix())
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              for p, digest in manifest.items(): assert hashlib.sha256(z.read('church_build/' + p)).hexdigest() == digest, p
          sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_suffix('.zip.sha256').write_text(sha + '  ' + archive.name + '\n')
          print('Verified full source archive:', len(files)+1, 'files; SHA256', sha)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Phase7B-Cloud-Verified-v4-complete-source
          path: |
            Church_ERP_Sanctuary_OS_Phase7B_Cloud_Verified_v4_2026-11-13.zip
            Church_ERP_Sanctuary_OS_Phase7B_Cloud_Verified_v4_2026-11-13.zip.sha256
